name: Debug APK (Android 12+ test build)

# Test-only build: produces installable debug-signed APKs (Gradle debug
# keystore) from the android12-compat branch. This is NOT the signed
# release flow in release.yml, which requires release-keystore secrets,
# the main branch, a version tag, and device acceptance.
on:
  workflow_dispatch:
    inputs:
      edition:
        description: Edition to build
        required: false
        default: full
        type: choice
        options:
          - full
          - lite
          - all

permissions:
  contents: read

env:
  ANDROID_BUILD_TOOLS: "37.0.0"
  BERGAMOT_NDK: "23.1.7779620"
  HYMT2_NDK: "29.0.14206865"
  ANDROID_CMAKE: "3.31.6"

jobs:
  debug-apk:
    name: Build ${{ inputs.edition }} debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out source and native submodules
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          # setup-android defaults to `tools platform-tools`; the `tools`
          # package was removed from the SDK repository and makes
          # sdkmanager fail. Upstream ci.yml/release.yml pass the same.
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platforms;android-36" \
            "platforms;android-37.0" \
            "build-tools;$ANDROID_BUILD_TOOLS" \
            "ndk;$BERGAMOT_NDK" \
            "ndk;$HYMT2_NDK" \
            "cmake;$ANDROID_CMAKE"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.edition }}" in
            full) ./gradlew --no-daemon --stacktrace assembleFullDebug ;;
            lite) ./gradlew --no-daemon --stacktrace assembleLiteDebug ;;
            all) ./gradlew --no-daemon --stacktrace assembleFullDebug assembleLiteDebug ;;
          esac
          ls -lh app/build/outputs/apk/*/debug/*.apk

      - name: Verify APK signature and contents
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner"
          for apk in app/build/outputs/apk/*/debug/*.apk; do
            echo "== $apk"
            "$apksigner" verify --print-certs "$apk"
            unzip -l "$apk" | grep -E "lib/arm64-v8a/|AndroidManifest.xml|classes.dex" | head -20
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ScreenTranslation-debug-apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/full/debug/*.apk
            app/build/outputs/apk/lite/debug/*.apk
          if-no-files-found: error
          retention-days: 14
