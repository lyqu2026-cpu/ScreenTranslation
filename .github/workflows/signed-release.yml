name: Signed release (Android 12+ fork build)

# Fork-only signed release: builds the Full Release APK signed with this
# fork's own release key (stored in Actions secrets, see RELEASING.md) and
# publishes it as a GitHub Release with the APK attached. This is NOT
# upstream's release flow (release.yml), which additionally requires the
# main branch, a version tag matching Gradle, and device acceptance.
# The fork's signing key differs from upstream's: users must uninstall
# any upstream-signed build of the same package before installing this one.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create (must not already exist)
        required: false
        default: v2.5.0-android12
        type: string
      prerelease:
        description: Mark the release as a pre-release
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  ANDROID_BUILD_TOOLS: "37.0.0"
  BERGAMOT_NDK: "23.1.7779620"
  HYMT2_NDK: "29.0.14206865"
  ANDROID_CMAKE: "3.31.6"

jobs:
  signed-release:
    name: Build signed Full Release APK and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out source and native submodules
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platforms;android-36" \
            "platforms;android-37.0" \
            "build-tools;$ANDROID_BUILD_TOOLS" \
            "ndk;$BERGAMOT_NDK" \
            "ndk;$HYMT2_NDK" \
            "cmake;$ANDROID_CMAKE"

      - name: Materialize release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64"
          key_store="${{ runner.temp }}/screen-translation-release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$key_store"
          test -s "$key_store"
          chmod 600 "$key_store"

      - name: Build signed Full Release APK
        shell: bash
        env:
          ANDROID_RELEASE_STORE_FILE: ${{ runner.temp }}/screen-translation-release.jks
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace assembleFullRelease
          ls -lh app/build/outputs/apk/full/release/*.apk

      - name: Verify APK signature and contents
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner"
          apk="app/build/outputs/apk/full/release/app-full-release.apk"
          test -s "$apk"
          "$apksigner" verify --verbose --print-certs "$apk"
          unzip -l "$apk" | grep -E "lib/arm64-v8a/|AndroidManifest.xml|classes.dex" | head -20

      - name: Publish GitHub Release with signed APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          apk="app/build/outputs/apk/full/release/app-full-release.apk"
          notes="ScreenTranslation Full edition (Hy-MT2 Q4) built from the android12-compat branch: minSdk 31 (Android 12+), targetSdk 34, compileSdk 37.

          This is a fork build, signed with this fork's own release key, NOT upstream's key. If you have an upstream-signed build of com.screentranslation.app.full installed, uninstall it first; Android will refuse to install over it with a different signature.

          First run downloads the ~1.06 GiB HY-MT2 Q4 model on Wi-Fi. Source: android12-compat @ ${{ github.sha }}."
          gh release create "$tag" \
            --target "${{ github.ref_name }}" \
            --title "ScreenTranslation $tag (Android 12+ fork build)" \
            --notes "$notes" \
            $([ "${{ inputs.prerelease }}" = "true" ] && echo "--prerelease") \
            "$apk"
